<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Marvellous Motors</title>
    <link rel="stylesheet" href="style.css">
<script src="/security.js" defer></script></head>
<body>

    <h1>Edit Profile</h1>

    <form action="/edit-profile" method="POST">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{.Name}}"
            required
        >

        <br><br>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            value="{{.Email}}"
            disabled
        >

        <br><br>

        <label for="phone">Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{.Phone}}"
            required
        >

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="/customer-profile">Cancel</a>

</body>
</html>
