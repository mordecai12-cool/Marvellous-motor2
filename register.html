<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Marvellous Motors</title>
    <link rel="stylesheet" href="style.css">
<script src="/security.js" defer></script></head>

<body>

    <nav>
        <h2>Marvellous Motors</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="register-page">

        <div class="register-box">

            <h1>Create Your Account</h1>

            <p>Join Marvellous Motors and start your journey.</p>

            {{if .Error}}<div class="auth-error" role="alert">{{.Error}}</div>{{end}}<form action="/register" method="POST">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name" value="{{.Name}}"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email" value="{{.Email}}"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone" value="{{.Phone}}"
                    placeholder="Enter your phone number"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="/login.html">Sign In</a>
            </p>

        </div>

    </section>

</body>
</html>
