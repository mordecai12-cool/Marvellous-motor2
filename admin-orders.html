<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders - Marvellous Motors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Marvellous Motors Admin</h2>

        <a href="admin.html">Dashboard</a>
        <a href="index.html">Home</a>
    </nav>

    <section class="admin-orders">

        <h1>Customer Orders</h1>

        <div id="orders">

            {{range .}}

            <div class="admin-order">

                <h2>Order #{{.ID}}</h2>

                <p>Name: {{.Name}}</p>
                <p>Email: {{.Email}}</p>
                <p>Phone: {{.Phone}}</p>

                <p>Address: {{.Address}}</p>
                <p>City: {{.City}}</p>
                <p>State: {{.State}}</p>

                <p>Status: {{.Status}}</p>

            </div>

            {{else}}

                <p>No orders found.</p>
            {{end}}
        </div>

    </section>

</body>
</html>
